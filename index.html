<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toobit Preset Bot Ranker & Squeeze Guardian</title>
  <style>
    :root {
      --bg: #090d13;
      --panel: #151b23;
      --card: #1c2430;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #238636;
      --green-text: #3fb950;
      --red: #da3633;
      --red-text: #f85149;
      --orange-text: #e3b341;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      color: var(--text-bright);
    }
    .header p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }
    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 260px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-bright);
      font-family: monospace;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button:hover {
      background: #2ea043;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-bright);
      cursor: pointer;
      user-select: none;
    }
    .status-bar {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid rgba(48, 54, 61, 0.5);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }
    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card.alert-border {
      border-color: var(--red);
      box-shadow: 0 0 8px rgba(218, 54, 51, 0.4);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .pair-name {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-bright);
    }
    .sub-badges {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      align-items: center;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-short {
      background: rgba(248, 81, 73, 0.15);
      color: var(--red-text);
    }
    .badge-lev {
      background: rgba(227, 179, 65, 0.15);
      color: var(--orange-text);
    }
    .verdict-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tag-strong {
      background: rgba(46, 160, 67, 0.2);
      color: var(--green-text);
      border: 1px solid var(--green);
    }
    .tag-moderate {
      background: rgba(227, 179, 65, 0.2);
      color: var(--orange-text);
      border: 1px solid var(--orange-text);
    }
    .tag-danger {
      background: rgba(248, 81, 73, 0.2);
      color: var(--red-text);
      border: 1px solid var(--red);
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #11161d;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .metric-col {
      display: flex;
      flex-direction: column;
    }
    .metric-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .metric-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-bright);
    }
    .metric-value.positive { color: var(--green-text); }
    .metric-value.negative { color: var(--red-text); }
    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Toobit Futures Preset Bot Screener</h1>
      <p>Tracks live 24h market momentum against Toobit's app bot presets and dispatches webhook alerts during short-squeeze risks.</p>
    </div>

    <div class="controls">
      <div class="input-row">
        <input type="text" id="apiKey" placeholder="Toobit API Key (Header: X-BB-APIKEY)" />
        <input type="text" id="webhookUrl" placeholder="Discord or Webhook Relay URL (POST JSON alerts)" />
      </div>
      <div class="input-row" style="align-items: center; justify-content: space-between;">
        <div class="btn-group">
          <button onclick="runAnalysis()">Sync Prices & Analyze</button>
          <label class="toggle-label">
            <input type="checkbox" id="autoAlertToggle" /> Auto-Monitor (60s loop)
          </label>
        </div>
        <div style="font-size: 12px; color: var(--muted);">
          Thresholds: <strong>Surge &gt; 5%</strong> triggers Discord/Webhook dispatch.
        </div>
      </div>
      <div class="status-bar">
        <span id="apiStatus">Idle. Click 'Sync Prices & Analyze' to run.</span>
        <span id="lastUpdated">-</span>
      </div>
    </div>

    <div class="bot-grid" id="botGrid"></div>
  </div>

  <script>
    const presetBots = [
      { symbol: "MUSDT", pair: "M-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 33.66, cycle: 1.5, gridProfit: 1.0164 },
      { symbol: "KATUSDT", pair: "KAT-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 28.67, cycle: 1.5, gridProfit: 1.0146 },
      { symbol: "CAPAPPUSDT", pair: "CAPAPP-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 26.49, cycle: 2.5, gridProfit: 0.4607 },
      { symbol: "LENOVOUSDT", pair: "LENOVO-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 25.32, cycle: 1.5, gridProfit: 0.6447 },
      { symbol: "KORUUSDT", pair: "KORU-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 24.48, cycle: 1.5, gridProfit: 1.6811 },
      { symbol: "JCTUSDT", pair: "JCT-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 8, apy: 23.22, cycle: 1.5, gridProfit: 2.5987 },
      { symbol: "EVAAUSDT", pair: "EVAA-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 21.01, cycle: 1.5, gridProfit: 1.3175 },
      { symbol: "MUSDT_6X", baseSym: "MUSDT", pair: "M-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 6, apy: 20.75, cycle: 1.5, gridProfit: 0.8261 },
      { symbol: "SLVONUSDT", pair: "SLVON-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 20.67, cycle: 1.5, gridProfit: 0.7386 },
      { symbol: "SHAZUSDT", pair: "SHAZ-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 20.54, cycle: 1.5, gridProfit: 1.3148 },
      { symbol: "RAMUSDT", pair: "RAM-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 19.70, cycle: 1.5, gridProfit: 1.3811 },
      { symbol: "INTWUSDT", pair: "INTW-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 17.55, cycle: 1.5, gridProfit: 1.2603 },
      { symbol: "GUAUSDT", pair: "GUA-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 16.93, cycle: 1.5, gridProfit: 1.0643 },
      { symbol: "TURBOUSDT", pair: "TURBO-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 16.22, cycle: 2.0, gridProfit: 3.0598 },
      { symbol: "TRIAUSDT", pair: "TRIA-SWAP-USDT", type: "Futures Grid", dir: "Short", lev: 10, apy: 15.99, cycle: 1.5, gridProfit: 2.1386 }
    ];

    const alertCooldowns = new Map();
    let pollTimer = null;

    async function sendRiskAlert(bot, reason) {
      const webhookUrl = document.getElementById('webhookUrl').value.trim();
      if (!webhookUrl) return;

      const now = Date.now();
      const lastAlert = alertCooldowns.get(bot.symbol) || 0;
      if (now - lastAlert < 10 * 60 * 1000) {
        return;
      }

      const payload = {
        username: "Toobit Squeeze Guardian",
        content: `🚨 **Liquidation Risk Detected: ${bot.symbol} (${bot.lev}X Short)**`,
        embeds: [
          {
            title: `Position Risk Alert: ${bot.symbol}`,
            color: 14297139,
            fields: [
              { name: "Trigger Reason", value: reason, inline: false },
              { name: "24h Price Change", value: `${bot.liveChange > 0 ? '+' : ''}${bot.liveChange.toFixed(2)}%`, inline: true },
              { name: "Leverage", value: `${bot.lev}X Short`, inline: true },
              { name: "Grid Spread", value: `${bot.gridProfit}%`, inline: true },
              { name: "Est. Liq Price", value: bot.estLiq !== 'N/A' ? `$${bot.estLiq}` : 'Awaiting sync', inline: true },
              { name: "Last Price", value: bot.lastPrice !== 'N/A' ? `$${bot.lastPrice}` : 'Awaiting sync', inline: true },
              { name: "Action", value: "Review open grid bounds or stop-loss before execution.", inline: false }
            ],
            timestamp: new Date().toISOString()
          }
        ]
      };

      try {
        const res = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alertCooldowns.set(bot.symbol, now);
          console.log(`Alert sent for ${bot.symbol}`);
        } else {
          console.warn(`Webhook failed with status: ${res.status}`);
        }
      } catch (err) {
        console.error("Webhook network error:", err);
      }
    }

    async function fetchLiveMetrics(apiKey) {
      const headers = {};
      if (apiKey) headers['X-BB-APIKEY'] = apiKey;

      try {
        const res = await fetch('https://api.toobit.com/api/v1/futures/ticker/24hr', { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return Array.isArray(data) ? data : (data.data || []);
      } catch (err) {
        console.warn("Direct API call blocked or offline:", err.message);
        return null;
      }
    }

    async function runAnalysis() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const status = document.getElementById('apiStatus');
      const timestampElem = document.getElementById('lastUpdated');

      status.textContent = 'Querying live contract books...';

      const liveTickers = await fetchLiveMetrics(apiKey);
      status.textContent = liveTickers ? 'Live tickers active.' : 'Evaluating with offline/cached profiles.';
      timestampElem.textContent = `Updated: ${new Date().toLocaleTimeString()}`;

      const evaluated = presetBots.map(bot => {
        const lookup = (bot.baseSym || bot.symbol).replace(/[^a-zA-Z0-9]/g, '');
        let liveChange = 0;
        let lastPrice = 'N/A';
        let estLiq = 'N/A';

        if (liveTickers) {
          const match = liveTickers.find(t => {
            const sym = (t.symbol || '').replace(/[^a-zA-Z0-9]/g, '');
            return sym === lookup || sym === `${lookup}USDT` || sym === bot.pair.replace(/[^a-zA-Z0-9]/g, '');
          });

          if (match) {
            liveChange = parseFloat(match.priceChangePercent || 0);
            const rawPrice = parseFloat(match.lastPrice || match.close || 0);
            lastPrice = rawPrice;
            // Short liquidation price approximation: Entry * (1 + 1/Leverage - MMR ~0.005)
            estLiq = (rawPrice * (1 + (1 / bot.lev) - 0.005)).toFixed(4);
          }
        }

        // Base quantitative scoring
        let rawScore = (bot.apy * bot.gridProfit) / (bot.lev * Math.sqrt(bot.cycle));

        // Penalty if coin is pumping against the short position
        if (liveChange > 3.0) {
          rawScore *= 0.5;
        }

        let verdict = "MODERATE";
        let verdictClass = "tag-moderate";
        let alertState = false;

        // Danger detection
        if (bot.lev >= 10 && liveChange >= 5.0) {
          verdict = "SQUEEZE DANGER";
          verdictClass = "tag-danger";
          alertState = true;
          sendRiskAlert({ ...bot, liveChange, lastPrice, estLiq }, `24h gain is +${liveChange.toFixed(2)}%. High short liquidation hazard.`);
        } else if (bot.lev >= 10 && bot.gridProfit < 0.5) {
          verdict = "HIGH FEE RISK";
          verdictClass = "tag-danger";
        } else if (rawScore > 3.2 && bot.gridProfit >= 1.0 && liveChange <= 1.5) {
          verdict = "STRONG CANDIDATE";
          verdictClass = "tag-strong";
        }

        return {
          ...bot,
          displayName: bot.baseSym ? `${bot.baseSym} Perpetual` : `${bot.symbol} Perpetual`,
          rawScore,
          verdict,
          verdictClass,
          alertState,
          liveChange,
          lastPrice,
          estLiq
        };
      });

      evaluated.sort((a, b) => b.rawScore - a.rawScore);
      renderCards(evaluated);
    }

    function renderCards(bots) {
      const grid = document.getElementById('botGrid');
      grid.innerHTML = '';

      bots.forEach(bot => {
        const card = document.createElement('div');
        card.className = `card ${bot.alertState ? 'alert-border' : ''}`;

        const priceDisplay = bot.lastPrice !== 'N/A' ? `$${Number(bot.lastPrice).toLocaleString()}` : 'Syncing...';
        const liqDisplay = bot.estLiq !== 'N/A' ? `$${Number(bot.estLiq).toLocaleString()}` : 'Calculating...';
        const changeClass = bot.liveChange > 0 ? 'positive' : (bot.liveChange < 0 ? 'negative' : '');
        const changeSign = bot.liveChange > 0 ? '+' : '';

        card.innerHTML = `
          <div>
            <div class="card-head">
              <div>
                <h3 class="pair-name">${bot.displayName}</h3>
                <div class="sub-badges">
                  <span class="badge badge-short">${bot.dir}</span>
                  <span class="badge badge-lev">${bot.lev}X</span>
                  <span style="font-size: 11px; color: var(--muted);">${bot.type}</span>
                </div>
              </div>
              <span class="verdict-tag ${bot.verdictClass}">${bot.verdict}</span>
            </div>

            <div class="metrics-grid">
              <div class="metric-col">
                <span class="metric-label">7D Backtested APY</span>
                <span class="metric-value positive">+${bot.apy.toFixed(2)}%</span>
              </div>
              <div class="metric-col">
                <span class="metric-label">Profit / Grid</span>
                <span class="metric-value">${bot.gridProfit}%</span>
              </div>
              <div class="metric-col">
                <span class="metric-label">Last Price</span>
                <span class="metric-value">${priceDisplay}</span>
              </div>
              <div class="metric-col">
                <span class="metric-label">24h Change</span>
                <span class="metric-value ${changeClass}">${changeSign}${bot.liveChange.toFixed(2)}%</span>
              </div>
              <div class="metric-col">
                <span class="metric-label">Est. Liq Price (Short)</span>
                <span class="metric-value negative">${liqDisplay}</span>
              </div>
              <div class="metric-col">
                <span class="metric-label">Rec. Cycle</span>
                <span class="metric-value">${bot.cycle} Days</span>
              </div>
            </div>
          </div>

          <div class="card-footer">
            <span>Suitability Score: <strong>${bot.rawScore.toFixed(2)}</strong></span>
            <span>Spread Coverage: ${bot.gridProfit >= 1.0 ? 'Strong' : 'Marginal'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('autoAlertToggle').addEventListener('change', (e) => {
      if (e.target.checked) {
        runAnalysis();
        pollTimer = setInterval(runAnalysis, 60000);
        document.getElementById('apiStatus').textContent = "Auto-monitoring loop active (60s).";
      } else {
        clearInterval(pollTimer);
        document.getElementById('apiStatus').textContent = "Auto-monitoring paused.";
      }
    });

    runAnalysis();
  </script>
</body>
</html>
